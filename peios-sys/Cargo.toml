[package]
name = "peios-sys"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Raw FFI bindings to libpeios (the Peios userspace C ABI)"
# `links` must equal libpeios' [lib] name (`peios`). Cargo enforces one -sys
# crate per native lib, which is exactly what we want for libpeios.so.
links = "peios"
build = "build.rs"

# Minimum C SDK consumed by this crate; build.rs enforces it for pkg-config.
[package.metadata.libpeios]
minimum-version = "0.5.11"

[features]
default = []           # → dynamic link against libpeios.so
static = []            # → static link against libpeios.a
# Reuse the canonical Rust mirror of the pkm uapi types instead of letting
# bindgen emit its own copy. See build.rs + the README.
uapi = ["dep:peios-uapi"]

[dependencies]
# Optional: the same generated #[repr(C)] mirror libpeios itself consumes,
# pinned to the same pkm rev so the kacs_*/pkm types are one identity.
peios-uapi = { git = "https://github.com/peios/pkm.git", rev = "c8e323ee29b67efa8d8b9ee1279b5a9fd4168056", default-features = false, optional = true }

[build-dependencies]
bindgen = "0.70"
pkg-config = "0.3"
toml = { version = "0.8", default-features = false, features = ["parse"] }
